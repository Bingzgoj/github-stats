name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish release asset
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcurl4-openssl-dev libcjson-dev

      - name: Build
        run: make clean && make

      - name: Package binary
        run: |
          set -euo pipefail

          tag_name="${GITHUB_REF_NAME}"
          safe_tag="${tag_name//\//-}"
          asset_base="github-stats-${safe_tag}-linux-x86_64"

          mkdir -p "dist/${asset_base}"
          cp github-stats LICENSE README.md "dist/${asset_base}/"
          cp -r templates "dist/${asset_base}/"
          (
            cd "dist/${asset_base}"
            sha256sum github-stats > SHA256SUMS
          )
          tar -C dist -czf "dist/${asset_base}.tar.gz" "${asset_base}"

      - name: Create GitHub Release and upload asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if ! gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release create "${TAG_NAME}" \
              --title "${TAG_NAME}" \
              --notes "Automated release for ${TAG_NAME}."
          fi

          gh release upload "${TAG_NAME}" dist/*.tar.gz --clobber
