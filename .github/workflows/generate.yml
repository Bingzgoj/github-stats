name: Generate GitHub Stats SVG

on:
  schedule:
    # GitHub Actions uses UTC. 22:00 UTC = 06:00 (UTC+8) next day.
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcurl4-openssl-dev libcjson-dev

      - name: Build
        run: make clean && make

      - name: Run generator
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GITHUB_ACTOR: ${{ vars.GITHUB_ACTOR }}
          # Optional:
          # EXCLUDED: "owner/private-*"
          # EXCLUDED_LANGS: "HTML,CSS,JSON"
        run: ./github-stats

      - name: Commit to the output branch of repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m 'temp commit' || echo
          git checkout output 2>/dev/null || git checkout --orphan output && git rm -rf . && git checkout main -- generated/
          # "echo" returns true so the build succeeds, even if no changed files
          git commit -m 'Update generated files' || echo
          git push origin output -f
