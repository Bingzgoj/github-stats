name: Generate GitHub Stats SVG

on:
  schedule:
    # GitHub Actions uses UTC. 22:00 UTC = 06:00 (UTC+8) next day.
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcurl4-openssl-dev libcjson-dev

      - name: Build
        run: make clean && make

      - name: Run generator
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GITHUB_ACTOR: ${{ vars.GITHUB_ACTOR }}
          # Optional:
          # EXCLUDED: "owner/private-*"
          # EXCLUDED_LANGS: "HTML,CSS,JSON"
        run: ./github-stats

      - name: Commit generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update generated github stats"
          file_pattern: generated/*.svg
